<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ticker</title>
<meta name="description" content="Live tracker for stocks, ETFs and crypto. Watchlist, portfolio, charts, news and price alerts.">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ticker">
<meta name="application-name" content="Ticker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=t2">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=t2">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=t2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=t2">
<script>
(function(){
  try{
    var raw=localStorage.getItem('ticker.theme'), t=null;
    try{t=JSON.parse(raw)}catch(e){t=raw}
    if(t!=='light'&&t!=='dark') t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    document.documentElement.dataset.theme=t;
    var m=document.querySelector('meta[name=theme-color]');
    if(m) m.content=t==='dark'?'#070708':'#f4f3ef';
  }catch(e){}
})();
</script>
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="Ticker home">
      <img class="mark" src="icons/icon-192.png" alt="">
      <span class="wm">Ticker</span>
    </a>
    <div class="top-r">
      <div class="ccy" id="ccy" role="group" aria-label="Display currency">
        <button type="button" data-ccy="GBP">GBP</button>
        <button type="button" data-ccy="USD">USD</button>
      </div>
      <span class="live" id="live" title="Data status"><i></i><span id="liveTxt">Loading</span></span>
      <button class="ib" id="themeBtn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
    </div>
  </div>
</header>

<div id="pager">
  <div id="track">
    <section class="view" data-tab="home" id="v-home"><div class="ptr" aria-hidden="true"></div><div class="view-in" id="homeIn"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></section>
    <section class="view" data-tab="markets" id="v-markets"><div class="ptr" aria-hidden="true"></div><div class="view-in" id="marketsIn"><div class="sk"></div><div class="sk"></div></div></section>
    <section class="view" data-tab="watch" id="v-watch"><div class="ptr" aria-hidden="true"></div><div class="view-in" id="watchIn"><div class="sk"></div><div class="sk"></div></div></section>
    <section class="view" data-tab="port" id="v-port"><div class="ptr" aria-hidden="true"></div><div class="view-in" id="portIn"><div class="sk"></div></div></section>
    <section class="view" data-tab="alerts" id="v-alerts"><div class="ptr" aria-hidden="true"></div><div class="view-in" id="alertsIn"><div class="sk"></div></div></section>
  </div>
</div>

<section id="detail" class="sheet-page" hidden></section>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>

<nav class="tabs" id="dock" aria-label="Tabs">
  <span class="dpill" aria-hidden="true"><i></i></span>
  <button type="button" data-k="0" aria-label="Home">
    <svg viewBox="0 0 24 24"><path d="M4 11.5L12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </button>
  <button type="button" data-k="1" aria-label="Markets">
    <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-6M22 19V8"/></svg>
    <span>Markets</span>
  </button>
  <button type="button" data-k="2" aria-label="Watchlist">
    <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
    <span>Watchlist</span>
  </button>
  <button type="button" data-k="3" aria-label="Portfolio">
    <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V7a4 4 0 0 1 8 0v1"/></svg>
    <span>Portfolio</span>
  </button>
  <button type="button" data-k="4" aria-label="Alerts">
    <svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
    <span>Alerts</span>
  </button>
</nav>

<script src="vendor/lightweight-charts.js?v=t2"></script>
<script src="app.js?v=t2"></script>
</body>
</html>
